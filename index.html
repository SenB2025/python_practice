<!-- This page creates a simple browser-based Python editor using Pyodide. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Python Practice</title>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px;
            background: #f5f6f8;
        }

        h1 {
            margin-bottom: 5px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 320px;
            box-sizing: border-box;
            padding: 15px;
            font-family: Consolas, monospace;
            font-size: 16px;
            line-height: 1.5;
            border: 1px solid #bbb;
            border-radius: 8px;
            background: white;
            resize: vertical;
        }

        button {
            padding: 10px 20px;
            margin-top: 12px;
            margin-right: 8px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        #run {
            background: #333;
            color: white;
        }

        #clear {
            background: #ddd;
        }

        #status {
            margin: 15px 0;
            color: #555;
        }

        /* Arrange the code editor and output panel side by side. */

.editor-container {
    display: flex;
    gap: 20px;
    align-items: stretch;
}

.panel {
    flex: 1;
}

.panel h3 {
    margin-top: 0;
}

#output {
    background: #1e1e1e;
    color: #eee;
    padding: 15px;
    min-height: 320px;
    margin: 0;
    border-radius: 8px;
    white-space: pre-wrap;
    font-family: Consolas, monospace;
    font-size: 16px;
    box-sizing: border-box;
    overflow: auto;
}

/* On smaller screens, stack the panels vertically. */

@media (max-width: 700px) {
    .editor-container {
        flex-direction: column;
    }
}
        #output {
            background: #1e1e1e;
            color: #eee;
            padding: 15px;
            min-height: 120px;
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: Consolas, monospace;
        }
    </style>
</head>

<body>

    <h1>Python Practice</h1>

    <div class="subtitle">
        Write Python code, run it, experiment, and learn by doing.
    </div>

    <textarea id="code"># Try changing this code and run it.

numbers = [10, 20, 30, 40]

print("Numbers:", numbers)
print("First number:", numbers[0])
print("Total:", sum(numbers))
<!-- This layout places the Python input and output areas side by side. -->

<div class="editor-container">

    <div class="panel">
        <h3>Python Code</h3>

        <textarea id="code"># Try changing this code and run it.

numbers = [10, 20, 30, 40]

print("Numbers:", numbers)
print("First number:", numbers[0])
print("Total:", sum(numbers))
</textarea>

        <button id="run">▶ Run Python</button>
        <button id="clear">Clear Output</button>
    </div>

    <div class="panel">
        <h3>Output</h3>

        <pre id="output"></pre>
    </div>

</div>

<div id="status">Loading Python...</div>

    <script>
        let pyodide;

        async function loadPython() {
            pyodide = await loadPyodide();
            document.getElementById("status").textContent =
                "Python is ready. Write some code and click Run.";
        }

        async function runPython() {
            const code = document.getElementById("code").value;
            const output = document.getElementById("output");

            output.textContent = "";

            try {
                pyodide.setStdout({
                    batched: (text) => {
                        output.textContent += text + "\n";
                    }
                });

                await pyodide.runPythonAsync(code);

            } catch (error) {
                output.textContent = error;
            }
        }

        document.getElementById("run").addEventListener("click", runPython);

        document.getElementById("clear").addEventListener("click", () => {
            document.getElementById("output").textContent = "";
        });

        loadPython();
    </script>

</body>
</html>
